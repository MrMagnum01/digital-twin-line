# digital-twin-line - frozen experiment configuration (LOCK ONLY).
#
# This file is the single numeric/config source of truth for
# src/generator.py, src/ingest.py, src/features.py and src/evaluator.py.
# Those modules read every frozen number from here; they do not hardcode
# duplicates. Its sha256 is recorded in experiment-lock.json. Any change to
# this file after the lock is a new labelled experiment version.
#
# Protocol: vault:10-projects/freelance/launch/twin/frozen-ml-protocol.md
# (original draft + its binding amendments dated 2026-09-27; the amendments
# govern where they narrow or override the draft).

version: "lock-2"

plant_ingest_reference:
  repo: "see .gitmodules (submodule url)"
  commit: "7e378facb410b529d8e2d72d329daf2eee515161"
  submodule_path: "vendor/plant-shift-oee-report"
  reused_symbols: ["ingester._parse_ts", "ingester._content_hash"]

# ---------------------------------------------------------------------------
# Line, assets, sensors
# ---------------------------------------------------------------------------
line:
  line_id: "LINE_A"
  # Same fictional line/machine identity as the plant demo
  # ("Line A: filler -> capper -> labeller").
  assets:
    FILLER: {tag: "LINE_A.FILLER", code: 1}
    CAPPER: {tag: "LINE_A.CAPPER", code: 2}
    LABELLER: {tag: "LINE_A.LABELLER", code: 3}

sensors:
  # order is fixed and used everywhere (features column order, messages)
  order: [vibration_rms, bearing_temp_c, motor_current_a, line_pressure_bar]
  units:
    vibration_rms: "mm/s RMS"
    bearing_temp_c: "degC"
    motor_current_a: "A"
    line_pressure_bar: "bar (gauge)"
  # Physical range accepted by src/ingest.py (inclusive). Outside -> bad_payload.
  ingest_range:
    vibration_rms: [0.0, 100.0]
    bearing_temp_c: [-50.0, 250.0]
    motor_current_a: [0.0, 1000.0]
    line_pressure_bar: [0.0, 100.0]
  # Generator floors these at 0.0 after noise and faults (non-negative quantities).
  non_negative: [vibration_rms, motor_current_a, line_pressure_bar]

# ---------------------------------------------------------------------------
# Generator
# ---------------------------------------------------------------------------
generator:
  sample_period_s: 1              # 1 Hz, exact integer-second UTC grid
  timestamp_jitter: "none"        # samples sit exactly on the grid; the only
                                  # jitter process is missingness (below)
  day_seconds: 86400

  # Seed derivation (stable, NOT Python hash()):
  #   M = 2**64 - 1
  #   mix64(x): SplitMix64 finaliser
  #       x = (x + 0x9E3779B97F4A7C15) & M
  #       x = ((x ^ (x >> 30)) * 0xBF58476D1CE4E5B9) & M
  #       x = ((x ^ (x >> 27)) * 0x94D049BB133111EB) & M
  #       return x ^ (x >> 31)
  #   derive_seed(date_seed, asset_code, stream_code)
  #       = mix64(mix64(mix64(date_seed) ^ asset_code) ^ stream_code)
  #   split_seed(split_seeds, stream_code): acc = 0;
  #       for s in split_seeds (table order): acc = mix64(acc ^ s)
  #       return mix64(acc ^ stream_code)
  #   RNG = numpy.random.Generator(numpy.random.PCG64(seed)), numpy pinned.
  seed_derivation:
    function: "splitmix64-fold"
    streams:
      noise: 1
      jitter: 2
      fault_quota: 3          # split-level: which asset-days get which fault
      fault_bearing_wear: 11
      fault_overheating: 12
      fault_pressure_spikes: 13
      fault_stuck_sensor: 14
      fault_dropout: 15

  # Noise: per sensor, stationary Gaussian AR(1), unit variance, run
  # continuously over the whole split for each asset (innovations drawn per
  # date from that date's noise seed, days in date order):
  #   y[0] = sqrt(1-phi^2)*e[0] + phi*z0,  y[n] = phi*y[n-1] + sqrt(1-phi^2)*e[n]
  #   z0, e[n] ~ N(0,1) (numpy Generator.standard_normal). Sensor noise = sigma(s) * y.
  noise:
    distribution: "gaussian_ar1"
    ar1_phi:
      vibration_rms: 0.6
      bearing_temp_c: 0.98
      motor_current_a: 0.8
      line_pressure_bar: 0.5

  # Per-asset nominal means (at speed fraction s = 1.0) and noise scales.
  assets_nominal:
    FILLER:   {vibration_rms: 2.0, bearing_temp_c: 48.0, motor_current_a: 12.0, line_pressure_bar: 4.0}
    CAPPER:   {vibration_rms: 1.6, bearing_temp_c: 44.0, motor_current_a: 8.0,  line_pressure_bar: 3.2}
    LABELLER: {vibration_rms: 1.2, bearing_temp_c: 40.0, motor_current_a: 5.0,  line_pressure_bar: 2.4}
  assets_sigma:
    FILLER:   {vibration_rms: 0.12, bearing_temp_c: 0.25, motor_current_a: 0.25, line_pressure_bar: 0.05}
    CAPPER:   {vibration_rms: 0.10, bearing_temp_c: 0.25, motor_current_a: 0.20, line_pressure_bar: 0.04}
    LABELLER: {vibration_rms: 0.08, bearing_temp_c: 0.20, motor_current_a: 0.15, line_pressure_bar: 0.03}

  # Speed response. level(s) = nominal * (floor + (1-floor)*s); for noise-
  # scaled sensors sigma(s) = sigma * (floor + (1-floor)*s), else sigma is
  # constant. bearing_temp_c follows a first-order lag towards
  # ambient + (nominal - ambient)*s with time constant tau (discrete:
  # T[n] = a*T[n-1] + (1-a)*target[n], a = exp(-1/tau), T[0] = target[0]),
  # run continuously over the split.
  speed_response:
    vibration_rms: {floor: 0.15, noise_scales_with_level: true}
    motor_current_a: {floor: 0.10, noise_scales_with_level: true}
    line_pressure_bar: {floor: 0.20, noise_scales_with_level: true}
    bearing_temp_c: {ambient_c: 25.0, lag_tau_s: 900, noise_scales_with_level: false}

  # Normal regime schedule, identical every day, seconds from 00:00 UTC.
  # Half-open [start, end). Speed fraction s ramps linearly inside ramps.
  # Present in EVERY split: startup, steady, speed change 80%->100%, planned stop.
  regime_schedule:
    - {state: STARTUP,      start: 0,     end: 1200,  s_from: 0.0, s_to: 0.8}
    - {state: STEADY_80,    start: 1200,  end: 28800, s_from: 0.8, s_to: 0.8}
    - {state: SPEED_CHANGE, start: 28800, end: 29400, s_from: 0.8, s_to: 1.0}
    - {state: STEADY_100,   start: 29400, end: 50400, s_from: 1.0, s_to: 1.0}
    - {state: STOPPING,     start: 50400, end: 51000, s_from: 1.0, s_to: 0.0}
    - {state: PLANNED_STOP, start: 51000, end: 54600, s_from: 0.0, s_to: 0.0}
    - {state: RESTART,      start: 54600, end: 55800, s_from: 0.0, s_to: 1.0}
    - {state: STEADY_100,   start: 55800, end: 85800, s_from: 1.0, s_to: 1.0}
    - {state: SHUTDOWN,     start: 85800, end: 86400, s_from: 1.0, s_to: 0.0}
  # Operating time for scoring = every state except PLANNED_STOP.
  non_operating_states: [PLANNED_STOP]

  # Test-only unseen normal change: product changeover, +8% nominal motor
  # current (multiplies the current level and does not change sigma) from
  # 18:00 UTC to the end of the day, on EVERY test asset-day. Labelled NORMAL
  # in the label channel (normal_changes), never a fault.
  unseen_normal_change:
    splits: [test]
    kind: "product_changeover"
    label: "NORMAL"
    sensor: motor_current_a
    relative_shift: 0.08
    start_s: 64800
    end_s: 86400

  missing_jitter:
    # Independent Bernoulli per (sample, sensor), drawn from the date's
    # jitter stream for EVERY grid sample (drawn regardless of faults, so the
    # jitter pattern never depends on the fault schedule). Separate from the
    # planted data faults; reported separately in prevalence_report().
    rate: 0.005

  warmup_minutes: 30          # excluded at the start of every split
  scoring_tail_minutes: 10

  # Operating-state rules for faults. An event's complete interval PLUS its
  # 10-minute scoring tail, [onset, end + tail), must lie inside ONE block of
  # the allowed states within one day, start at or after the split's warm-up
  # end, and not intersect any other event's [onset, end + tail) on the same
  # asset (overlap policy: no overlap on the same asset; different assets
  # are independent).
  fault_state_rules:
    equipment_allowed_states: [STEADY_80, SPEED_CHANGE, STEADY_100]
    data_allowed_states: [STARTUP, STEADY_80, SPEED_CHANGE, STEADY_100, STOPPING, RESTART, SHUTDOWN]
  overlap_policy: "no_overlap_same_asset_including_tail"

  # Prevalence: EXACT QUOTAS (not probabilities), chosen per split:
  #   per_asset_day_fraction f: for each asset, round_half_up(f * n_days)
  #     of its days (sampled without replacement) get exactly one event.
  #   one_per_n_asset_days n: round_half_up(n_asset_days / n) distinct
  #     asset-days (sampled without replacement from the split's asset-days
  #     in (date, asset) order) get exactly one event.
  #   round_half_up(x) = floor(x + 0.5).
  # Onset: uniform over every eligible integer second of the chosen
  # asset-day (eligible per fault_state_rules). Durations are sampled first.
  # Label interval = [onset, onset + duration) (half-open, seconds);
  # label end = onset + duration. After the label end the effect is removed
  # at once (synthetic repair / recovery).
  # Processing order: fault types in the order listed below, then
  # asset-days in (date, asset code) order.
  faults:
    bearing_wear:
      code: BW
      channel: equipment
      sensor: vibration_rms
      prevalence: {rule: per_asset_day_fraction, value: 0.4}
      duration_s: {dist: fixed, value: 7200}
      # additive offset = sigma_nominal(asset, vibration) * ramp, ramp linear
      # from 0.5 at onset to 3.0 at the last second of the interval
      severity: {kind: linear_ramp_sigma, from: 0.5, to: 3.0}
    overheating:
      code: OH
      channel: equipment
      sensor: bearing_temp_c
      prevalence: {rule: one_per_n_asset_days, value: 3}
      duration_s: {dist: fixed, value: 1800}
      severity: {kind: linear_ramp_abs, from: 1.0, to: 6.0}   # degC
    pressure_spikes:
      code: PS
      channel: equipment
      sensor: line_pressure_bar
      prevalence: {rule: one_per_n_asset_days, value: 3}
      duration_s: {dist: fixed, value: 600}
      # n_spikes ~ uniform integer {3,4,5}; spike seconds sampled uniformly
      # without replacement inside the interval; each spike is ONE 1 Hz
      # sample with additive +4 * sigma_nominal(asset, pressure)
      severity: {kind: spikes_sigma, n_min: 3, n_max: 5, height_sigma: 4.0, width_s: 1}
    stuck_sensor:
      code: SS
      channel: data
      sensor: any_one      # one sensor chosen uniformly from sensors.order
      prevalence: {rule: one_per_n_asset_days, value: 4}
      duration_s: {dist: uniform_int_inclusive, min: 1200, max: 3600}
      # the chosen sensor holds its (post-equipment-fault, pre-missingness)
      # value at the onset second for the whole interval
      severity: {kind: hold_value_at_onset}
    dropout:
      code: DO
      channel: data
      sensor: all          # whole-asset comms loss: all four sensors missing
      prevalence: {rule: one_per_n_asset_days, value: 4}
      duration_s: {dist: uniform_int_inclusive, min: 120, max: 900}
      severity: {kind: all_missing}

  # Event IDs: EV-<YYYYMMDD>-<ASSET>-<CODE>-<nn>, nn = 1-based ordinal of
  # that fault type on that asset-day (always 01 under the quota rules).
  event_id_format: "EV-{date}-{asset}-{code}-{n:02d}"

# ---------------------------------------------------------------------------
# Split tables
# ---------------------------------------------------------------------------
# LOCKED table: seeds map to 20 distinct consecutive UTC dates in table order
# (train days 1-10, validation 11-14, test 15-20). NOT generated in this
# milestone - generator refuses it unless explicitly unlocked (see README).
split_table_locked:
  day1_utc: "2024-03-04"
  splits:
    - {name: train,      seeds: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110], assets: [FILLER, CAPPER]}
    - {name: validation, seeds: [201, 202, 203, 204], assets: [FILLER, CAPPER]}
    - {name: test,       seeds: [301, 302, 303, 304, 305, 306], assets: [LABELLER, FILLER]}
  # test strata, reported separately, never pooled
  test_strata:
    FILLER: "seen_asset_later_time"
    LABELLER: "unseen_asset_later_time"

# DEVELOPMENT table: out-of-band seeds and dates, used ONLY to test the
# infrastructure. Never reported as train/validation/test results.
split_table_dev:
  day1_utc: "2023-09-04"
  splits:
    - {name: train,      seeds: [901, 902, 903], assets: [FILLER, CAPPER]}
    - {name: validation, seeds: [904], assets: [FILLER, CAPPER]}
    - {name: test,       seeds: [905, 906], assets: [LABELLER, FILLER]}
  test_strata:
    FILLER: "seen_asset_later_time"
    LABELLER: "unseen_asset_later_time"

# Assets that may never appear in train/validation (unseen-asset stratum).
unseen_assets: [LABELLER]

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
features:
  window_s: 10                 # output grid: one row per 10 s window
  # Window k covers grid seconds [a_k, a_k + 10); its output is emitted at
  # e_k = a_k + 10 and uses ONLY samples with timestamp t < e_k, t >= split start.
  rolling_windows_s: {"5m": 300, "30m": 1800}
  # A rolling window at e covers raw 1 Hz samples with e - W <= t < e,
  # clipped at the split start (no data before the split, none carried).
  input_resolution: "raw_1hz"  # summaries consume raw 1 Hz samples, not 10 s aggregates
  stats: [mean, std, slope]
  std_definition: "population (ddof=0) over finite samples in the rolling window"
  slope_definition: "ordinary least-squares slope of value on timestamp (units per second) over finite samples in the rolling window"
  # Minimum finite samples to emit mean/std/slope for a rolling window:
  min_observations: {"5m": 150, "30m": 900}
  # missing_frac = 1 - finite_samples / expected_samples, where
  # expected_samples = number of declared grid seconds in the window (clipped
  # at split start), NOT the number of messages that arrived. NaN (absent)
  # and +/-inf (non-finite) are both "not finite" and both count as missing.
  missing_fraction:
    windows: ["10s", "5m", "30m"]
    denominator: "declared_grid_seconds"
  # Data-quality outcomes (a window with any of these is ineligible for
  # scoring, is never counted as a healthy/negative window, and is reported
  # in the excluded-window table with its reason). all_sensors_missing and
  # partial_sensor_missing are the CURRENT-window health outcome (this
  # window's own 10 s block, per sensor), frozen because the rolling 5m/30m
  # statistics can stay finite from older samples while the current block is
  # blind - a live sensor/comms dropout must never be reported healthy on
  # stale history. all_sensors_missing = every sensor has zero finite
  # samples in this window's own 10 s block (e.g. a whole-asset comms
  # dropout). partial_sensor_missing = at least one, but not all, sensors
  # have zero finite samples in this window's own 10 s block. Reason
  # priority (highest wins when more than one applies to the same window):
  # warm_up > all_sensors_missing > partial_sensor_missing >
  # non_finite_input > insufficient_observations.
  dq_reasons: [warm_up, non_finite_input, insufficient_observations, partial_sensor_missing, all_sensors_missing]
  imputation: "none"           # no imputed values; ineligible windows are excluded and reported
  imputation_constants: {}
  # Scaler: fitted on TRAIN eligible windows only, all train assets together.
  # No per-test-asset fitted normalisation.
  scaler:
    name: "sklearn.preprocessing.RobustScaler"
    params: {with_centering: true, with_scaling: true, quantile_range: [25.0, 75.0], unit_variance: false}
    fit_on: "train eligible windows only (after warm-up), no schedule/label filtering; train faults are NOT cleaned out"
  # Zero-variance rule: a feature whose TRAIN inter-quartile range
  # (numpy.percentile, method 'linear') is <= epsilon is DROPPED from the
  # model input; the dropped list is recorded with the fitted scaler.
  zero_variance: {rule: "drop", epsilon: 1.0e-12}
  # Column names that must never appear in feature output (substring match,
  # case-insensitive). Enforced in code by features.assert_no_leak().
  deny_substrings: [label, event, fault, asset, machine, tag, seed, split, onset, truth, schedule, regime, state, planned, changeover, normal_change, stratum, date]

# ---------------------------------------------------------------------------
# Scoring / evaluator
# ---------------------------------------------------------------------------
scoring:
  # Alert time of a window = its end e (when the output becomes available).
  # Debounce per (split, asset): consecutive alert windows belong to one
  # episode while gap <= 60 s, where gap = start of next alert window - end
  # of previous alert window. gap > 60 s starts a new episode.
  debounce_gap_s: 60
  # Episode start = end time of its first alert window.
  # Episode state (operating / planned stop / normal change) = state of its
  # first alert window.
  # Event match window for alert START: [onset, end + tail] inclusive.
  scoring_tail_s: 600
  matching: "one_to_one_per_asset; events by (onset, event_id); earliest unmatched episode start in [onset, end+tail]"
  # Point level: window [a, a+10) is positive for a channel if it intersects
  # any planted interval [onset, end) of that channel. Predictions = raw
  # thresholded windows before debouncing. Computed over eligible windows;
  # excluded windows are reported with their truth breakdown.
  point_channels: [equipment, data]
  # Precision/recall/F1: F1 = 2TP / (2TP + FP + FN); N/A (None) when the
  # denominator is 0. Precision is generic alert precision (no predicted
  # fault type exists); recall is reported by true fault type and channel.
  zero_denominator: "N/A"
  false_alert_cap_per_operating_hour: 1.0
  delay_quantiles: [0.5, 0.9]
  delay_quantile_method: "linear"        # numpy.quantile method (Hyndman-Fan type 7)
  # Validation selection objective: overall event F1 over all planted events
  # (equipment + data), validation assets FILLER+CAPPER pooled. Test strata
  # are never pooled.
  selection_objective: "event_f1_all_channels_validation_pooled"
  tie_break_order: [max_event_f1, fewer_false_alerts, fewer_total_alerts, stricter_threshold]
  no_alert_always_candidate: true
  always_alert_scope: "every eligible window (the constant detector has no operating-state input)"

# ---------------------------------------------------------------------------
# Models (FROZEN PARAMETERS ONLY - nothing in this repo fits them)
# ---------------------------------------------------------------------------
models:
  no_alert_baseline: {}
  always_alert_baseline: {}
  static_threshold:
    # Protocol baseline (frozen-ml-protocol.md): "a per-sensor static
    # threshold at mean +/- k*sigma from train, k chosen on validation".
    # Computed directly on each sensor's {sensor}__mean_5m feature (raw
    # sensor units), NOT on the RobustScaler-scaled matrix IsolationForest
    # uses - a materially different baseline with different units, which is
    # not this model. Train mean/std are the population (ddof=0) mean and
    # std of {sensor}__mean_5m over TRAIN eligible windows (same eligibility
    # as the scaler fit). A window alerts if, for ANY sensor, its
    # {sensor}__mean_5m lies outside [train_mean - k*train_std,
    # train_mean + k*train_std]. Same eligible input windows as
    # IsolationForest. k is chosen on validation from k_grid by the same
    # selection_objective/tie_break_order as IsolationForest's threshold.
    aggregation_rule: "any_sensor_mean_5m_outside_train_mean_pm_k_std"
    feature: "mean_5m"
    fit_on: "train eligible windows only (after warm-up), no schedule/label filtering; train faults are NOT cleaned out"
    k_grid: [1, 2, 3, 4, 5, 6]
    strictness: "larger k is stricter"
  isolation_forest:
    library: "scikit-learn"
    params:
      n_estimators: 200
      max_samples: 256
      max_features: 1.0
      bootstrap: false
      contamination: 0.01      # fixed BEFORE training, not tuned; sets the library's offset only
      random_state: 7
    anomaly_score: "-score_samples"
    threshold_candidates:
      source: "train anomaly-score quantiles"
      quantiles: [0.90, 0.95, 0.975, 0.99, 0.995, 0.999]
      quantile_method: "linear"   # numpy.quantile method
      plus_no_alert: true
      strictness: "higher threshold is stricter"
  threshold_search_on_test: false
